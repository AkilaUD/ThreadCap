name: Railway config

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

env:
  HAS_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip (no RAILWAY_TOKEN)
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::RAILWAY_TOKEN not configured — Railway plan skipped"
      - uses: railwayapp/config@v1
        if: env.HAS_TOKEN == 'true'
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Skip (no RAILWAY_TOKEN)
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::RAILWAY_TOKEN not configured — Railway apply skipped"
      - uses: railwayapp/config@v1
        if: env.HAS_TOKEN == 'true'
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}