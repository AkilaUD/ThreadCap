name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && success()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    env:
      HAS_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
      HAS_PROJECT: ${{ vars.RAILWAY_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @railway/cli
      - name: Deploy ${{ matrix.service }} to Railway
        if: env.HAS_TOKEN == 'true' && env.HAS_PROJECT == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach --service "${{ matrix.service }}" --project "$RAILWAY_PROJECT_ID"
      - name: Skip deploy ${{ matrix.service }}
        if: env.HAS_TOKEN != 'true' || env.HAS_PROJECT != 'true'
        run: echo "::warning::RAILWAY_TOKEN / RAILWAY_PROJECT_ID not configured — ${{ matrix.service }} deploy skipped"